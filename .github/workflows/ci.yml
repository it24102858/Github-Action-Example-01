name: Login Registration CI

on:
  push:
    branches:
      - main
      - develop

  pull_request:
    branches:
      - main
      - develop

jobs:

# Frontend
  frontend-ci:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22 

      - name: Install frontend dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Build React application
        run: npm run build

#Backend

  backend-ci:
    runs-on: ubuntu-latest

    defaults:
       run:
         working-directory: ./backend

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22      
      
      - name: Install backend dependencies
        run: npm ci

      - name: Check backend syntax
        run: |
          node --check server.js
          node --check config/db.js
          node --check models/User.js
          node --check routes/authRoutes.js  
